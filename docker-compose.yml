x-cassie-service: &cassie-service
  build:
    context: .
    args:
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
      NEXT_PUBLIC_PRIVY_SIGNER_ID: ${NEXT_PUBLIC_PRIVY_SIGNER_ID}
      NEXT_PUBLIC_PRIVY_SIGNER_POLICY_IDS: ${NEXT_PUBLIC_PRIVY_SIGNER_POLICY_IDS}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
  env_file:
    - .env
  init: true
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-postgres}@postgres:5432/cassie
  depends_on:
    postgres:
      condition: service_healthy

x-cassie-runtime: &cassie-runtime
  <<: *cassie-service
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cassie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - cassie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cassie"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *cassie-service
    restart: "no"
    command: ["npm", "run", "db:migrate"]

  web:
    <<: *cassie-runtime
    command: ["npm", "run", "web:start:migrated"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-postgres}@postgres:5432/cassie
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *cassie-runtime
    command: ["npm", "run", "worker:migrated"]

volumes:
  cassie-postgres-data:
