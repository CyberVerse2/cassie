x-cassie-service: &cassie-service
  build:
    context: .
    args:
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
      NEXT_PUBLIC_PRIVY_SIGNER_ID: ${NEXT_PUBLIC_PRIVY_SIGNER_ID}
      NEXT_PUBLIC_PRIVY_SIGNER_POLICY_IDS: ${NEXT_PUBLIC_PRIVY_SIGNER_POLICY_IDS}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
  env_file:
    - .env
  init: true
  restart: unless-stopped
  environment:
    - CASSIE_POSTGRES_HOST
    - CASSIE_POSTGRES_PORT
    - CASSIE_POSTGRES_USER
    - CASSIE_POSTGRES_PASSWORD
    - CASSIE_POSTGRES_DATABASE

x-cassie-runtime: &cassie-runtime
  <<: *cassie-service
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *cassie-service
    restart: "no"
    command: ["npm", "run", "db:migrate"]

  web:
    <<: *cassie-runtime
    command: ["npm", "run", "web:start"]
    environment:
      - CASSIE_POSTGRES_HOST
      - CASSIE_POSTGRES_PORT
      - CASSIE_POSTGRES_USER
      - CASSIE_POSTGRES_PASSWORD
      - CASSIE_POSTGRES_DATABASE
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *cassie-runtime
    command: ["npm", "run", "worker"]
